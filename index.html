<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
	<title> Paddle </title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta name="viewport" content="height=device-height, initial-scale=1.0" />
	<link rel="stylesheet" type="text/css" href="index.css">
	<link rel="stylesheet" type="text/css" href="./PlugIns/FontAwesome/css/font-awesome.min.css">
<style>

.desktop-intro { display:none; }
#stats i { cursor:pointer; }
@media (min-width:768px) {
 .desktop-intro { display:block; position:fixed; top:24px; left:0; width:100%; margin:0; text-align:center; font:600 28px Arial,sans-serif; color:#fff; }
 #main-sub { width:365px; height:450px; flex-flow:column nowrap; justify-content:flex-start; transform:scale(1.3); }
 #settingsOp { display:none; }
 #arena { flex:0 0 364px; width:348px; height:364px; }
 #stats { flex:0 0 55px; margin:20px auto 0; }
 #main > p { bottom:24px !important; font-size:15px !important; color:#bac7e8 !important; }
 .control { cursor:pointer; }
 .control::after { position:absolute; top:50%; color:#7180a8; font:40px Arial,sans-serif; pointer-events:none; }
 .control.left::after { content:'←'; left:18%; }
 .control.right::after { content:'→'; right:18%; }
 .control:active::after { color:#fff; }
}
@media (min-width:768px) and (min-height:850px) { #main-sub { transform:scale(1.5); } }
@media (min-width:768px) and (max-height:680px) { #main-sub { transform:scale(1.05); } .desktop-intro { top:12px; font-size:22px; } #main > p { bottom:10px !important; } }

</style>
</head>
<body>

<main id="main">
<h1 class="desktop-intro">Paddle</h1>

		<div class="control left" style="touch-action: none" aria-label="Move left"
			v-on:pointerdown.prevent="$event.currentTarget.setPointerCapture($event.pointerId); t_start_back()"
			v-on:pointerup="t_end()"
			v-on:pointercancel="t_end()"
			v-on:lostpointercapture="t_end()"
		>
		</div>
		<div class="control right" style="touch-action: none" aria-label="Move right"
			v-on:pointerdown.prevent="$event.currentTarget.setPointerCapture($event.pointerId); t_start_front()"
			v-on:pointerup="t_end()"
			v-on:pointercancel="t_end()"
			v-on:lostpointercapture="t_end()"
		>
		</div>
	
	<div id="main-sub">
		<div id="settingsOp"
			:class="isPaused && isBegun? 'visible' : ''"	>
			<span class="fa fa-cog">
		</div>
	
		<div id="arena">
			
			<span id="bot"
				:style="{ 'left' : botPos+'px' }"
			> <b></b> </span>
			<b id="ball"
				class="fa fa-futbol-o"
				:style="{'left': ballX+'px', 'top': ballY+'px'}"
			></b>
			<span id="player"
				:style="{'left' : playerPos+'px'}"
			> <b></b> </span>
			
		</div>
		<div id="stats">
			<transition name="score" mode="out-in">
			<span :key="botScore">{{ botScore }}</span>
			</transition>
			
			<i class="fa"
				:class="isPaused? 'fa-play' : 'fa-pause' "
				@click="pausePlay()"
			></i>
	
			
			<transition name="score" mode="out-in">
				<span :key="playerScore">{{ playerScore }}</span>
			</transition>
		</div>
 		
 		<!-- div id="controls">
			<div id="bar-box">
				<div class="fa fa-angle-left"
					v-on:pointerdown.prevent="$event.currentTarget.setPointerCapture($event.pointerId); t_start_back()"
					v-on:pointerup="t_end()"
			v-on:pointercancel="t_end()"
			v-on:lostpointercapture="t_end()"
				></div>
				<div class="fa fa-angle-right"
					v-on:pointerdown.prevent="$event.currentTarget.setPointerCapture($event.pointerId); t_start_front()"
					v-on:pointerup="t_end()"
			v-on:pointercancel="t_end()"
			v-on:lostpointercapture="t_end()"
				></div>
			</div>
		</div -->
	</div>	
<p style="position:absolute;bottom:8px;left:0;width:100%;margin:0;text-align:center;color:#fff;font:12px sans-serif;pointer-events:none">Hold either side or use &larr; &rarr; to move. Space to pause.</p>
</main>

</body>
<script type="text/javascript" src="./PlugIns/fullPrefixFree.js"></script>
<script type="text/javascript" src="./PlugIns/Vue/vue.min.js"></script>

<script type="text/javascript" src="./PlugIns/Synaptic/synaptic.js"></script>
<!--script type="text/javascript" src="./PlugIns/Synaptic/synapticWrapper_1.js"></script-->

<script type="text/javascript" src="index.js"></script>

<script type="text/javascript" src="destination_trainer.js"></script>
<script type="text/javascript" src="target_trainer.js"></script>
<script type="text/javascript">
// Keep desktop controls consistent with the touch controls.
var heldDirections = [];
function updateKeyboardMovement() {
    game.t_end();
    var direction = heldDirections[heldDirections.length - 1];
    if (direction === "ArrowLeft") game.t_start_back();
    if (direction === "ArrowRight") game.t_start_front();
}
document.addEventListener("keydown", function(event) {
    if (event.key === "ArrowLeft" || event.key === "ArrowRight") {
        event.preventDefault();
        if (event.repeat) return;
        heldDirections.push(event.key);
        updateKeyboardMovement();
    } else if (event.code === "Space") {
        event.preventDefault();
        if (!event.repeat) {
            game.pausePlay();
            updateKeyboardMovement();
        }
    }
});
document.addEventListener("keyup", function(event) {
    if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
    event.preventDefault();
    heldDirections = heldDirections.filter(function(key) { return key !== event.key; });
    updateKeyboardMovement();
});
window.addEventListener("blur", function() {
    heldDirections = [];
    game.t_end();
});
</script>
</html>
